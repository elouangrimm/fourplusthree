<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>4 × 3 — Past puzzles</title>
        <link rel="manifest" href="manifest.json" />
        <script>
            (function () {
                var p = location.pathname;
                if (!/\/$/.test(p)) {
                    if (/\.[^\/]+$/.test(p)) p = p.replace(/[^\/]*$/, "");
                    else p += "/";
                }
                var b = document.createElement("base");
                b.setAttribute("href", p);
                document.head.appendChild(b);
            })();
        </script>
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="shared.css" />
        <script src="shared.js"></script>
    </head>
    <body>
        <div class="wrap">
            <header>
                <a href="index.html" style="display: block"
                    ><img class="logo" src="logo.png" alt="4 × 3"
                /></a>
                <div class="tag">Replay any earlier daily.</div>
            </header>
            <div class="card">
                <b>Past puzzles</b>
                <div class="hint">
                    Playing an old one won't affect today's game.
                </div>
                <div id="archiveList" class="archlist"></div>
            </div>
            <footer>
                <a href="index.html">← back to the game</a> ·
                <a href="scoring.html">scoring</a> ·
                <a href="build.html">build your own</a> ·
                <a href="history.html">history</a>
            </footer>
        </div>
        <script>
            "use strict";
            async function renderArchive() {
                const el = document.getElementById("archiveList");
                el.innerHTML = "<div class='hint'>Loading…</div>";
                let data = null,
                    failed = false;
                try {
                    const r = await fetch(pjURL(), { cache: "no-store" });
                    if (r.ok) data = await r.json();
                    else failed = true;
                    console.log("it worked");
                } catch (e) {
                    console.log("nope");
                    failed = true;
                }
                data = data || {};
                const today = todayStr();
                const showFuture = !!A11Y.fd;
                const keys = Object.keys(data)
                    .filter((k) => showFuture || k <= today)
                    .sort()
                    .reverse();
                if (!keys.length) {
                    el.innerHTML =
                        "<div class='hint'>" +
                        (failed
                            ? "Couldn't load the puzzle list — if you opened this file directly, run it through a local server or the live site so it can fetch puzzles.json."
                            : "No puzzles yet.") +
                        "</div>";
                    return;
                }
                el.innerHTML = "";
                keys.forEach((k) => {
                    const b = document.createElement("button");
                    const isToday = k === today;
                    const isFuture = k > today;
                    b.innerHTML =
                        "<span>" +
                        esc(fmtDate(k)) +
                        "</span>" +
                        "<span class='when'>" +
                        (isToday
                            ? "Today"
                            : isFuture
                              ? "Future (Spoiler!)"
                              : "") +
                        "</span>";
                    if (isFuture) {
                        b.style.borderColor = "var(--bad)";
                        b.style.borderWidth = "2px";
                    }
                    b.onclick = () => {
                        location.href = "index.html#d=" + k;
                    };
                    el.appendChild(b);
                });
            }
            renderArchive();
        </script>
    </body>
</html>
