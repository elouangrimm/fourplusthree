<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>4 × 3 — Past puzzles</title>
        <link rel="manifest" href="manifest.json" />
        <script>
            (function () {
                var p = location.pathname;
                if (!/\/$/.test(p)) {
                    if (/\.[^\/]+$/.test(p)) p = p.replace(/[^\/]*$/, "");
                    else p += "/";
                }
                var b = document.createElement("base");
                b.setAttribute("href", p);
                document.head.appendChild(b);
            })();
        </script>
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="shared.css" />
        <script src="shared.js"></script>
    </head>
    <body>
        <div class="wrap">
            <header>
                <a href="index.html" style="display: block"
                    ><img class="logo" src="logo.png" alt="4 × 3"
                /></a>
                <div class="tag">Replay any earlier daily.</div>
            </header>
            <div class="card">
                <b>Past puzzles</b>
                <div class="hint">
                    Playing an old one won't affect today's game.
                </div>
                <div id="archiveList" class="archlist"></div>
            </div>
            <footer>
                <a href="index.html">← back to the game</a> ·
                <a href="scoring.html">scoring</a> ·
                <a href="build.html">build your own</a> ·
                <a href="history.html">history</a>
            </footer>
        </div>
        <script>
            "use strict";
            async function renderArchive() {
                const el = document.getElementById("archiveList");
                el.innerHTML = "<div class='hint'>Loading…</div>";
                let data = null,
                    failed = false;

                try {
                    const r = await fetch(pjURL(), { cache: "no-store" });
                    if (r.ok) {
                        data = await r.json();
                    } else {
                        throw new Error("Fetching puzzles.json failed");
                    }
                } catch (e) {
                    const r = await fetch("puzzles.json", {
                        cache: "no-store",
                    });
                    if (r.ok) {
                        data = await r.json();
                    } else {
                        failed = true;
                    }
                }

                data = data || {};
                const today = todayStr();
                const showFuture = !!A11Y.fd;

                // Filter and sort keys descending (newest first)
                const keys = Object.keys(data)
                    .filter((k) => showFuture || k <= today)
                    .sort()
                    .reverse();

                if (!keys.length) {
                    el.innerHTML =
                        "<div class='hint'>" +
                        (failed
                            ? "Couldn't load the puzzle list."
                            : "No puzzles yet.") +
                        "</div>";
                    return;
                }

                el.innerHTML = "";

                // Create a dedicated container for future items if needed
                let futureContainer = null;
                if (showFuture && keys.some((k) => k > today)) {
                    const details = document.createElement("details");
                    details.className = "future-spoiler";
                    details.style.marginBottom = "1em";

                    const summary = document.createElement("summary");
                    summary.textContent = " Future Puzzles (Spoilers!)";
                    summary.style.cursor = "pointer";
                    summary.style.fontWeight = "bold";
                    summary.style.padding = "0.5em 0";

                    futureContainer = document.createElement("div");
                    futureContainer.style.display = "flex";
                    futureContainer.style.flexDirection = "column";
                    futureContainer.style.gap = "8px";
                    futureContainer.style.marginTop = "0.5em";

                    details.appendChild(summary);
                    details.appendChild(futureContainer);
                    el.appendChild(details);
                }

                keys.forEach((k) => {
                    const b = document.createElement("button");
                    const isToday = k === today;
                    const isFuture = k > today;

                    b.innerHTML =
                        "<span>" +
                        esc(fmtDate(k)) +
                        "</span>" +
                        "<span class='when'>" +
                        (isToday ? "Today" : isFuture ? "Future" : "") +
                        "</span>";

                    if (isFuture) {
                        b.style.borderColor = "var(--bad)";
                        b.style.borderWidth = "2px";
                    }

                    if (isToday) {
                        b.style.borderColor = "var(--good)";
                        b.style.borderWidth = "2px";
                    }

                    b.onclick = () => {
                        location.href = "index.html#d=" + k;
                    };

                    // Append to the spoiler drawer if it's a future puzzle, otherwise append normally
                    if (isFuture && futureContainer) {
                        futureContainer.appendChild(b);
                    } else {
                        el.appendChild(b);
                    }
                });
            }
            renderArchive();
        </script>
    </body>
</html>
