name: Check Hank Green 4x3 Updates

on:
  schedule:
    - cron: "0 0 * * *" # Everyday at midnight
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write # Allows the bot to save live files back to your repo

jobs:
  check-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all branches

      - name: Fetch Live Assets and Audit Code
        id: audit
        env:
          BASE_URL: "https://hankgreen.com/fourbythree"
        run: |
          FILES=(
            "index.html"
            "archive.html"
            "build.html"
            "scoring.html"
            "shared.js"
            "shared.css"
            "favicon.svg"
            "puzzles.json"
          )

          mkdir -p remote_mirror

          # Try to check out a cache branch containing the *previous* live run files
          # If it doesn't exist, it will create one cleanly based on your main branch
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet refs/remotes/origin/live-upstream; then
              git checkout live-upstream
          else
              git checkout -b live-upstream
          fi

          DISCORD_SUMMARY=""
          HAS_CHANGES="false"

          echo "Fetching assets from $BASE_URL..."

          for file in "${FILES[@]}"; do
              # Download live production file into root directory of the tracking branch
              if ! curl -sLf "$BASE_URL/$file" -o "remote_mirror_temp"; then
                  echo "Warning: Failed to download $file"
                  rm -f remote_mirror_temp
                  continue
              fi

              # Check against what was stored in live-upstream historically
              if [ ! -f "$file" ]; then
                  HAS_CHANGES="true"
                  mv remote_mirror_temp "$file"
                  DISCORD_SUMMARY="$DISCORD_SUMMARY
                  🆕 **New File Added**: \`$file\`"
              else
                  if ! cmp -s "$file" remote_mirror_temp; then
                      HAS_CHANGES="true"

                      if [[ "$file" =~ \.(html|js|css|json|svg)$ ]]; then
                          DIFF_STATS=$(diff --numstat "$file" remote_mirror_temp 2>/dev/null || true)
                          if [ ! -z "$DIFF_STATS" ]; then
                              ADDED=$(echo "$DIFF_STATS" | awk '{print $1}')
                              DELETED=$(echo "$DIFF_STATS" | awk '{print $2}')
                              DISCORD_SUMMARY="$DISCORD_SUMMARY
                              ⚠️ **Modified**: \`$file\` (+${ADDED} lines, -${DELETED} lines)"
                          else
                              DISCORD_SUMMARY="$DISCORD_SUMMARY
                              ⚠️ **Modified**: \`$file\`"
                          fi
                      else
                          DISCORD_SUMMARY="$DISCORD_SUMMARY
                          🖼️ **Modified Image**: \`$file\`"
                      fi
                      mv remote_mirror_temp "$file"
                  else
                      # File is identical to yesterday's live version
                      rm remote_mirror_temp
                  fi
              fi
          done

          # Save changes to the live tracking branch if any updates were caught
          if [ "$HAS_CHANGES" = "true" ]; then
              git add .
              git commit -m "Automated upstream update sync: $(date -u +'%Y-%m-%d %H:%M UTC')"
              git push origin live-upstream
          fi

          # Export properties cleanly
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT

          # Multi-line handling using unique delimiters
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$DISCORD_SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Summary to Discord
        if: steps.audit.outputs.has_changes == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          AUDIT_SUMMARY: ${{ steps.audit.outputs.summary }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Error: DISCORD_WEBHOOK secret is missing!"
            exit 1
          fi

          # Construct dynamic payload block cleanly using multi-line template injection strings
          # Using literal breaks instead of \n to fix Discord's text engine presentation formatting
          CONTENT="## 🧩 4 × 3 Game Update Report
          Changes detected between yesterday's version and Hank Green's live site:
            $AUDIT_SUMMARY

          🔗 View live site: https://hankgreen.com/fourbythree"

          PAYLOAD=$(jq -n --arg msg "$CONTENT" '{content: $msg}')

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "$DISCORD_WEBHOOK"
