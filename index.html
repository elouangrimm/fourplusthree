<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
        <title>4 × 3</title>
        <link rel="manifest" href="manifest.json" />
        <script>
            /* Resolve relative assets (favicons, etc.) against this page's own folder so they
   load whether the URL is /fourbythree, /fourbythree/, or .../index.html — a bare
   "favicon.svg" would otherwise hit the site root when there's no trailing slash.
   Runs before the icon links below so they pick up the base. */
            (function () {
                var p = location.pathname;
                if (!/\/$/.test(p)) {
                    if (/\.[^\/]+$/.test(p)) p = p.replace(/[^\/]*$/, "");
                    else p += "/";
                }
                var b = document.createElement("base");
                b.setAttribute("href", p);
                document.head.appendChild(b);
            })();
        </script>
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
        <link rel="stylesheet" href="shared.css" />
        <script src="shared.js"></script>
        <script src="stats-beacon.js"></script>
    </head>
    <body>
        <div class="wrap">
            <a
                id="streakTag"
                class="streak-tag"
                href="history.html"
                style="display: none"
            ></a>
            <header>
                <img
                    class="logo"
                    src="logo.png"
                    alt="4 × 3"
                    onerror="
                        const h = document.createElement('h1');
                        h.textContent = '4 × 3';
                        this.replaceWith(h);
                    "
                />
                <div class="tag">
                    Four categories. Three words each. One word is in all four.
                </div>
            </header>

            <!-- ============ PLAY ============ -->
            <div id="play" class="view on">
                <div
                    class="pauthor"
                    id="pSub"
                    style="margin: 2px auto 12px"
                ></div>
                <div id="betaBanner" class="betabanner" style="display: none">
                    🧪 <b>Beta test!</b> You're playtesting an unpublished
                    puzzle — feedback form at the end.
                </div>
                <div class="card">
                    <div id="boardWrap" style="display: none">
                        <div id="board"></div>
                        <div class="ctrls">
                            <button id="shuffleBtn" onclick="shuffleBoard()">
                                Shuffle
                            </button>
                            <button id="deselBtn" onclick="deselectAll()">
                                Deselect
                            </button>
                            <button
                                class="primary"
                                id="submitBtn"
                                onclick="submitGuess()"
                                disabled
                            >
                                Submit
                            </button>
                        </div>
                        <div class="mist" id="mist"></div>
                        <div class="solvedlist" id="solvedList"></div>
                    </div>
                    <div id="result" style="display: none" class="result"></div>
                </div>
                <div id="fbCard" style="display: none" class="card fb">
                    <b>🧪 Beta feedback for the creator</b>
                    <label
                        style="
                            display: block;
                            margin-top: 10px;
                            font-size: 14px;
                        "
                        >How hard was it? (1 = trivial, 5 = brutal)</label
                    >
                    <div class="stars" id="fbDiff"></div>
                    <label style="display: block; font-size: 14px"
                        >How fun was it?</label
                    >
                    <div class="stars" id="fbFun"></div>
                    <label style="display: block; font-size: 14px"
                        >Did you figure out the special word before the
                        end?</label
                    >
                    <div class="yn" id="fbSpecial">
                        <button
                            onclick="
                                fb.special = 'Yes';
                                ynPaint();
                            "
                        >
                            Yes
                        </button>
                        <button
                            onclick="
                                fb.special = 'No';
                                ynPaint();
                            "
                        >
                            No
                        </button>
                    </div>
                    <label
                        style="
                            display: block;
                            font-size: 14px;
                            margin-bottom: 4px;
                        "
                        >Notes for the creator</label
                    >
                    <textarea
                        id="fbNotes"
                        placeholder="Too easy? A category felt unfair? A word fits two groups?"
                    ></textarea>
                    <div class="rowbtns" style="margin-top: 10px">
                        <button
                            class="hbtn primary"
                            id="fbCopy"
                            onclick="copyFeedback()"
                        >
                            Copy feedback
                        </button>
                        <a
                            id="fbMail"
                            class="hbtn"
                            style="display: none; text-decoration: none"
                            >Email it</a
                        >
                    </div>
                </div>
            </div>

            <footer>
                by Hank Green
                <img
                    src="fishtrans.png"
                    alt=""
                    style="height: 20px; vertical-align: -5px; opacity: 0.4"
                />
                · <a href="scoring.html">scoring</a> ·
                <a href="archive.html">past puzzles</a> ·
                <a href="build.html">build your own</a> ·
                <a href="history.html">history</a>
            </footer>
        </div>
        <div id="modal">
            <div class="mback" onclick="closeModal()"></div>
            <div
                class="mcard"
                role="dialog"
                aria-modal="true"
                aria-label="Results"
            >
                <button
                    class="mclose"
                    onclick="closeModal()"
                    aria-label="Close"
                >
                    ×
                </button>
                <div id="mbody" class="result"></div>
            </div>
        </div>
        <div class="toast" id="toast"></div>
        <div id="deftip"></div>

        <script>
            "use strict";
            /* ---------- fallback puzzle (used if puzzles.json is unreachable) ---------- */
            const DEMO = {
                a: "Hank",
                e: "",
                s: "HEAVY",
                c: [
                    ["___ Metal", "DEATH", "GLAM"],
                    ["SpaceX Falcon Rockets", "ONE", "NINE"],
                    ["Serious", "SOMBER", "GRAVE"],
                    ["Boxing Weights", "WELTER", "MIDDLE"],
                ],
            };
            /* category-coloured card backs (blue, green, yellow, purple); unsolved tiles keep
               the default light back set in CSS (.tback) */
            const BACKS = [
                "bluefish.jpg",
                "greenfish.jpg",
                "yellowfish.jpg",
                "lightpurple.jpg",
            ];
            const EMOJI = ["🟦", "🟩", "🟨", "🟪"];
            /* lines through the center, keyed by CATEGORY index so position encodes color
               (an accessibility cue for players who can't distinguish the four hues):
               0 blue → diag ↘ (TL/BR), 1 green → middle column, 2 yellow → middle row, 3 purple → diag ↗ (BL/TR) */
            const LINES = [
                [0, 8],
                [1, 7],
                [3, 5],
                [2, 6],
            ];
            const CENTER = 4;
            /* stable 0/1/2 pick so the first-solved trio's hub sits in a fixed spot on its line
               (center only ~1/3 of the time) and doesn't jump around on refresh */
            function hubSlotPos(seed) {
                let h = 0;
                for (let i = 0; i < seed.length; i++)
                    h = (h * 31 + seed.charCodeAt(i)) | 0;
                return Math.abs(h) % 3;
            }
            const G = window.gsap || null;

            /* ---------- state ---------- */
            let puzzle = null,
                isBeta = false,
                dailyKey = null;
            let loadedDay = null,
                pendingKey = null,
                isPreview = false;
            let puzzleData =
                null; /* last good puzzles.json, reused by the archive */
            let cats = [],
                special = "",
                slots = [],
                slots0 = [],
                tiles = {};
            let selection = [],
                solvedIdx = [],
                colorCat = {},
                locked = new Set();
            let mistakes = 0,
                penalty = 0,
                guesses = [],
                over = false,
                animating = false;
            let adClicked = false; /* +AD_BONUS once per game if the player taps the ad */
            let startTime = 0,
                solveMs =
                    null; /* speed timer: starts on load, stops at the finish */
            let hubEmoji =
                null; /* emoji that bursts from the hub on the post-win tap (custom puzzles carry their own) */
            const MAXM = 3;
            let fb = { diff: 0, fun: 0, special: "" };
            let TW = 0,
                TH = 0,
                GAP = 8;
            /* chance a reflow includes a flip at all — at most ONE card flips per transition,
               chosen at random from the moving (non-hub) cards. Tweak to taste. */
            const FLIP_CHANCE = 0.2;
            let firstLoad = true; /* play the intro shuffle-in once, on the first load */
            let suppressFlip = false; /* shuffles set this so they don't trigger a card flip */
            let shuffling = false; /* lock out shuffle clicks until the current glide finishes */
            let introPlaying = false; /* true while the first-load intro is animating (don't relayout over it) */

            /* hub = the special word. It stays hidden until it's logically
               determined (two solved groups share exactly one word) or the game ends. */
            function hubKnown() {
                return solvedIdx.length >= 2 || over;
            }

            /* ---------- nav ---------- */
            /* the game is the only view on this page now; scoring / archive / build moved
               to their own pages (linked in the footer). showView stays a thin shim. */
            function showView(v) {
                if (v === "play" && !introPlaying) layout(true);
            }

            /* ---------- init / hash ---------- */
            async function init() {
                const h = location.hash;
                isBeta = false;
                puzzle = null;
                dailyKey = null;
                loadedDay = todayStr();
                pendingKey = null;
                isPreview = false;
                scheduleRollover();
                let archiveDate = null;
                try {
                    if (h.startsWith("#b=")) {
                        puzzle = decPuzzle(h.slice(3));
                        isBeta = true;
                    } else if (h.startsWith("#p=")) {
                        puzzle = decPuzzle(h.slice(3));
                    } else if (h.startsWith("#d=")) {
                        archiveDate = decodeURIComponent(h.slice(3));
                    }
                } catch (e) {
                    toast(
                        "Couldn't read that puzzle link — showing today's game.",
                    );
                }
                if (!puzzle) {
                    /* no link (or an #d= archive date): load from puzzles.json — that specific
                     day if given and valid, otherwise the most recent entry ≤ today */
                    try {
                        const r = await fetch(pjURL(), { cache: "no-store" });
                        if (r.ok) {
                            const data = await r.json();
                            puzzleData = data;
                            const today = todayStr();
                            let k = null;
                            if (
                                archiveDate &&
                                data[archiveDate] &&
                                archiveDate <= today
                            ) {
                                k = archiveDate;
                            } else {
                                const keys = Object.keys(data)
                                    .filter((k) => k <= today)
                                    .sort();
                                if (keys.length) k = keys[keys.length - 1];
                            }
                            if (k) {
                                puzzle = decPuzzle(data[k]);
                                dailyKey = k;
                            }
                        }
                    } catch (e) {}
                }
                if (!puzzle) puzzle = DEMO;
                setupPlay();
                showView("play");
            }
            function setupPlay() {
                document.getElementById("betaBanner").style.display = isBeta
                    ? ""
                    : "none";
                /* today's daily shows no date line at all; archived (past) puzzles get a dated pill; custom puzzles show a custom pill */
                let sub = "";
                if (dailyKey && dailyKey !== todayStr()) {
                    sub = fmtDate(dailyKey);
                } else if (!dailyKey) {
                    sub = isBeta ? "Beta Custom Puzzle" : "Custom Puzzle";
                }
                const ps = document.getElementById("pSub");
                ps.textContent = sub;
                ps.classList.remove("today");
                if (!dailyKey) {
                    ps.classList.add("today");
                }
                ps.style.display = sub
                    ? ""
                    : "none"; /* no empty spacer when there's no date line */
                document.getElementById("result").style.display = "none";
                document.getElementById("fbCard").style.display = "none";
                document.getElementById("solvedList").innerHTML = "";
                startGame();
            }

            /* ---------- midnight rollover ----------
               At local midnight (or when the tab wakes up on a new day), fetch puzzles.json
               and switch to the new daily. If a game is in progress, wait until it ends. */
            let rolloverTimer = null;
            function msUntilMidnight() {
                const n = new Date();
                return (
                    new Date(
                        n.getFullYear(),
                        n.getMonth(),
                        n.getDate() + 1,
                        0,
                        0,
                        2,
                    ) - n
                ); /* 2s past midnight */
            }
            function scheduleRollover() {
                clearTimeout(rolloverTimer);
                rolloverTimer = setTimeout(
                    checkNewDay,
                    Math.min(msUntilMidnight(), 2147483647),
                );
            }
            async function checkNewDay() {
                scheduleRollover();
                if (
                    location.hash.startsWith("#b=") ||
                    location.hash.startsWith("#p=") ||
                    location.hash.startsWith("#d=")
                )
                    return; /* linked or archived puzzle, not the daily */
                if (isPreview && !over)
                    return; /* don't stomp on a builder test run */
                if (todayStr() === loadedDay)
                    return; /* same day, nothing to do */
                loadedDay = todayStr();
                try {
                    const r = await fetch(pjURL(), { cache: "no-store" });
                    if (!r.ok) return;
                    const data = await r.json();
                    puzzleData = data;
                    const keys = Object.keys(data)
                        .filter((k) => k <= todayStr())
                        .sort();
                    const k = keys.length ? keys[keys.length - 1] : null;
                    if (!k || k === dailyKey)
                        return; /* no new puzzle for today */
                    if (!over && guesses.length > 0) {
                        /* mid-game: don't reset the board */
                        pendingKey = k;
                        toast(
                            "A new puzzle is ready — it'll be here when you finish.",
                        );
                        return;
                    }
                    if (
                        document.getElementById("modal").style.display ===
                        "flex"
                    )
                        closeModal();
                    init();
                } catch (e) {}
            }
            document.addEventListener("visibilitychange", () => {
                if (!document.hidden) checkNewDay();
            });
            window.addEventListener("focus", () => checkNewDay());
            /* Restored from the back/forward cache: the page is the frozen yesterday snapshot
                 and no JS has re-run, so re-check the day explicitly. This is the usual cause of
                 "I opened the URL and it's still showing yesterday's puzzle." */
            window.addEventListener("pageshow", (e) => {
                if (e.persisted) checkNewDay();
            });

            /* ---------- game setup ---------- */
            /* ---------- progress persistence ----------
                 Saves the live daily's progress so a refresh resumes exactly where you left
                 off (and a finished/failed game stays finished) — no restarting by reloading.
                 Only the actual day's official puzzle is persisted; beta links, the builder
                 preview, direct links and past archive puzzles stay freely replayable. */
            function gameKey() {
                return dailyKey &&
                    dailyKey === todayStr() &&
                    !isBeta &&
                    !isPreview
                    ? "x43_game_" + dailyKey
                    : null;
            }
            function loadGame() {
                const k = gameKey();
                if (!k) return null;
                try {
                    return JSON.parse(localStorage.getItem(k) || "null");
                } catch (e) {
                    return null;
                }
            }
            function saveGame() {
                const k = gameKey();
                if (!k) return;
                try {
                    localStorage.setItem(
                        k,
                        JSON.stringify({
                            v: 1,
                            s: special,
                            slots0,
                            solved: solvedIdx,
                            m: mistakes,
                            p: penalty,
                            g: guesses,
                            over,
                            t0: startTime,
                            sms: solveMs,
                            ad: adClicked ? 1 : 0,
                        }),
                    );
                } catch (e) {}
            }
            /* Rebuild the board state from a saved game, no animations, without
                 re-counting stats (those were tallied once, on the real finish). */
            function restoreGame(st) {
                (st.solved || []).forEach((ci) => {
                    solvedIdx.push(ci);
                    if (solvedIdx.length === 1) {
                        for (const w of [special, ...cats[ci].words])
                            colorCat[w] = ci;
                    } else {
                        for (const w of cats[ci].words) {
                            colorCat[w] = ci;
                            locked.add(w);
                        }
                        if (solvedIdx.length === 2) {
                            for (const w of cats[solvedIdx[0]].words)
                                locked.add(w);
                            delete colorCat[special];
                        }
                    }
                });
                mistakes = Math.min(MAXM, st.m || 0);
                adClicked = !!st.ad;
                penalty = st.p !== undefined ? st.p : (st.m || 0) * 15;
                startTime = st.t0 || Date.now();
                solveMs = st.sms !== undefined ? st.sms : null;
                guesses = Array.isArray(st.g) ? st.g : [];
                if (st.over) {
                    over = true;
                    for (const ci of solvedIdx)
                        for (const w of cats[ci].words) locked.add(w);
                    locked.add(special);
                    delete colorCat[special];
                }
                reflowSlots();
                syncDomOrder();
                renderSolvedList();
                paintTiles();
                layout(true);
                renderMist();
                updateButtons();
                if (over) {
                    document.getElementById("deselBtn").style.display = "none";
                    document.getElementById("shuffleBtn").style.display =
                        "none";
                    const won = mistakes < MAXM;
                    showResult(
                        won,
                        calcScore().score,
                        false,
                        true,
                    ); /* quiet: no auto-popped modal */
                    if (won && G) endFlourish();
                } else if (guesses.length || solvedIdx.length || mistakes) {
                    showWelcomeBack(); /* greet returning players; they click out to resume */
                }
            }
            /* Returning to an in-progress daily: a dismissible "Continue playing" screen
                 over the already-restored board (button, ✕, backdrop, or Esc all close it). */
            function showWelcomeBack() {
                const found = solvedIdx.length;
                let status =
                    found + " of 4 group" + (found === 1 ? "" : "s") + " found";
                if (mistakes > 0)
                    status +=
                        " · " +
                        (mistakes
                            ? mistakes +
                              " mistake" +
                              (mistakes === 1 ? "" : "s")
                            : "No mistakes");
                document.getElementById("mbody").innerHTML =
                    "<h2>Welcome back 👋</h2>" +
                    "<div class='score'>Today's puzzle is in progress.<br>" +
                    esc(status) +
                    "</div>" +
                    "<div class='rowbtns'><button class='hbtn primary' onclick='closeModal()'>Continue playing</button></div>";
                openModal(false);
            }

            function startGame() {
                special = norm(puzzle.s);
                hubEmoji =
                    puzzle.x ||
                    HUB_EMOJI[special] ||
                    null; /* custom puzzles set their own via builder */
                cats = puzzle.c.map((c) => ({
                    name: c[0],
                    words: [norm(c[1]), norm(c[2])],
                }));
                const words = [special, ...cats.flatMap((c) => c.words)];
                for (let i = words.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [words[i], words[j]] = [words[j], words[i]];
                }
                slots = words.slice();
                /* if there's saved progress for this puzzle, reuse its board order so tiles
                   sit where the player left them instead of reshuffling */
                const saved = loadGame();
                /* only resume if the saved board's words still match this puzzle — guards against a
                   puzzle being edited after someone started it (stale words would become orphan tiles) */
                const expected = words.slice().sort().join(" ");
                const resuming =
                    saved &&
                    saved.s === special &&
                    Array.isArray(saved.slots0) &&
                    saved.slots0.length === 9 &&
                    saved.slots0.slice().sort().join(" ") === expected;
                if (resuming) slots = saved.slots0.slice();
                slots0 = slots.slice();
                if (hubSpinTween) {
                    hubSpinTween.kill();
                    hubSpinTween = null;
                }
                hubFx.forEach((tw) => tw.kill());
                hubFx = [];
                selection = [];
                solvedIdx = [];
                colorCat = {};
                locked = new Set();
                mistakes = 0;
                penalty = 0;
                guesses = [];
                over = false;
                animating = false;
                adClicked = false;
                startTime = Date.now();
                solveMs = null;
                fb = { diff: 0, fun: 0, special: "" };
                document.getElementById("boardWrap").style.display = "";
                document.getElementById("result").style.display = "none";
                document.getElementById("fbCard").style.display = "none";
                document.getElementById("solvedList").innerHTML = "";
                const db = document.getElementById("deselBtn");
                db.style.display = "";
                db.style.opacity = "";
                const sb = document.getElementById("shuffleBtn");
                sb.style.display = "";
                sb.style.opacity = "";
                sb.disabled = false;
                shuffling = false;
                buildTiles();
                if (resuming) {
                    restoreGame(saved);
                } else {
                    if (firstLoad && G) introDeal();
                    else layout(true);
                    renderMist();
                    updateButtons();
                }
                firstLoad = false;
            }
            function buildTiles() {
                const b = document.getElementById("board");
                b.innerHTML = "";
                tiles = {};
                for (const w of slots) {
                    /* a real <button> (native focus + keyboard) exposed as a checkbox so screen
                     readers announce "WORD, checkbox, checked/not checked" — no interactable divs */
                    const t = document.createElement("button");
                    t.type = "button";
                    t.className = "tile";
                    const flip = document.createElement("div");
                    flip.className = "tflip";
                    const inner = document.createElement("div");
                    inner.className = "tin";
                    inner.style.animationDelay =
                        (-Math.random() * 16).toFixed(2) +
                        "s"; /* desync the color drift */
                    inner.appendChild(document.createTextNode(w));
                    const lbl =
                        document.createElement(
                            "span",
                        ); /* colour name shown only in "Labeled colors" mode */
                    lbl.className = "tlabel";
                    inner.appendChild(lbl);
                    const back = document.createElement("div");
                    back.className = "tback";
                    flip.appendChild(inner);
                    flip.appendChild(back);
                    t.appendChild(flip);
                    t.onclick = () =>
                        tapWord(
                            w,
                        ); /* native buttons fire click on Enter/Space too */
                    t.setAttribute("role", "checkbox");
                    t.setAttribute("aria-label", w);
                    t.setAttribute("aria-checked", "false");
                    b.appendChild(t);
                    tiles[w] = t;
                }
                paintTiles();
            }

            /* ---------- layout & movement ---------- */
            function slotXY(i) {
                return {
                    x: (i % 3) * (TW + GAP),
                    y: Math.floor(i / 3) * (TH + GAP),
                };
            }
            function layout(instant) {
                const b = document.getElementById("board");
                if (
                    !b ||
                    document.getElementById("boardWrap").style.display ===
                        "none"
                )
                    return;
                const W = b.clientWidth || b.parentElement.clientWidth - 34;
                TW = (W - 2 * GAP) / 3;
                TH = Math.max(56, TW * 0.62);
                b.style.height = 3 * TH + 2 * GAP + "px";
                /* one flip per transition, only FLIP_CHANCE of the time: pick a single moving,
                   non-hub card now (before the loop below rewrites positions) */
                let flipWord = null;
                if (
                    G &&
                    !instant &&
                    !suppressFlip &&
                    !reduceMotion() &&
                    Math.random() < FLIP_CHANCE
                ) {
                    const movers = slots.filter((w, i) => {
                        const t = w && tiles[w];
                        if (!t || w === special) return false;
                        const p = slotXY(i);
                        return t._sx !== p.x || t._sy !== p.y;
                    });
                    if (movers.length)
                        flipWord =
                            movers[Math.floor(Math.random() * movers.length)];
                }
                let moveIdx = 0;
                slots.forEach((w, i) => {
                    if (!w) return;
                    const t = tiles[w];
                    if (!t) return;
                    const p = slotXY(i);
                    t.style.width = TW + "px";
                    t.style.height = TH + "px";
                    const moved = t._sx !== p.x || t._sy !== p.y;
                    t._sx = p.x;
                    t._sy = p.y;
                    if (G && !instant && moved && !reduceMotion()) {
                        /* staggered glide with a little lift-and-settle */
                        const d = moveIdx++ * 0.055;
                        G.to(t, {
                            x: p.x,
                            y: p.y,
                            rotation: 0,
                            duration: 0.85,
                            delay: d,
                            ease: "power3.inOut",
                            overwrite: true,
                        }); /* rotation:0 clears any leftover tilt from an interrupted intro */
                        const inn = t.querySelector(".tin");
                        G.timeline({ delay: d })
                            .to(inn, {
                                scale: 1.06,
                                duration: 0.32,
                                ease: "power2.out",
                            })
                            .to(
                                inn,
                                {
                                    scale: 1,
                                    duration: 0.5,
                                    ease: "power2.inOut",
                                },
                                ">-0.05",
                            );
                        /* the one chosen card does a full 360° flip as it travels (lands face-up) */

            function syncDomOrder() {
                const b = document.getElementById("board");
                const want = slots.map((w) => w && tiles[w]).filter(Boolean);
                const cur = b.children;
                let same = cur.length === want.length;
                for (let i = 0; same && i < want.length; i++)
                    if (cur[i] !== want[i]) same = false;

            function reflowSlots() {
                const target = new Array(9).fill(null);
                if (solvedIdx.length === 1 && !over) {
                    /* first solve snaps to THIS category's colored line so the directional cue
                     shows immediately; the hub takes a stable 1-of-3 spot on the line (center
                     only ~1/3 of the time) so it isn't always given away as the middle card */
                    const ci = solvedIdx[0];
                    const cells = [LINES[ci][0], CENTER, LINES[ci][1]];
                    const words = cats[ci].words.slice();
                    const hp = hubSlotPos(special + "|" + ci);
                    let wi = 0;
                    cells.forEach((cell, idx) => {
                        target[cell] = idx === hp ? special : words[wi++];
                    });
                } else if (solvedIdx.length >= 2 || over) {
                    target[CENTER] = special;
                    solvedIdx.forEach((ci) => {
                        target[LINES[ci][0]] = cats[ci].words[0];
                        target[LINES[ci][1]] = cats[ci].words[1];
                    });
                } else return;
                const placed = new Set(target.filter(Boolean));
                const free = [];
                for (let i = 0; i < 9; i++) if (!target[i]) free.push(i);
                const pending = [];
                slots.forEach((w, i) => {
                    if (!w || placed.has(w)) return;
                    if (!target[i] && free.includes(i)) {
                        target[i] = w;
                        free.splice(free.indexOf(i), 1);
                    } else pending.push(w);

                for (const w of pending) {
                    const i = free.shift();

            /* MIDC (center-tile pastels) now lives in shared.js so colorblind mode can swap it */
            const LINE_ANGLES = [

            function hubGradient(offset) {
                offset = offset || 0;
                const stops = [];
                solvedIdx.forEach((ci) => {
                    for (const a of LINE_ANGLES[ci]) stops.push([a, MIDC[ci]]);
                });
                if (!stops.length) return "#fff";
                stops.sort((p, q) => p[0] - q[0]);
                const first = stops[0],
                    last = stops[stops.length - 1];
                const full = [
                    [last[0] - 360, last[1]],
                    ...stops,
                    [first[0] + 360, first[1]],

                return (
                    "conic-gradient(from " +
                    offset +
                    "deg," +
                    full.map((s) => s[1] + " " + s[0] + "deg").join(",") +

            let pollCfg = null;
            async function loadPoll() {
                /* prefer the live Vercel endpoint (reads the X poll); fall back to the hand-edited file.
                   the ?w= bucket changes every 5 min so we never get stuck on a stale cached response,
                   while still sharing one cached result (one X read) across everyone in that window */

                    const r = await fetch(
                        pjURL("https://www.hankgreen.com/api/hubpoll?w=") +
                            Math.floor(Date.now() / 300000),
                    );
                    if (r.ok) {
                        const j = await r.json();
                        if (j && j.active) {

            function pollEmoji() {
                if (
                    !pollCfg ||
                    !pollCfg.active ||
                    !Array.isArray(pollCfg.options)
                )
                    return null;
                const opts = pollCfg.options.filter(
                    (o) => o && o.emoji && o.weight > 0,
                );
                if (!opts.length) return null;
                const total = opts.reduce((a, o) => a + o.weight, 0);
                const slot = Math.floor(
                    Date.now() / 300000,
                ); /* 5-minute window */
                let h = (slot * 2654435761) >>> 0;
                h ^= h >>> 15;
                h = Math.imul(h, 2246822519) >>> 0;
                h ^= h >>> 13; /* uniform 0..1 from the slot */
                const r = ((h >>> 0) / 4294967296) * total;
                let acc = 0;
                for (const o of opts) {
                    acc += o.weight;
                    if (r < acc) return o.emoji;
                }
                return opts[opts.length - 1].emoji;

            function tapWord(w) {

                if (i >= 0) selection.splice(i, 1);
                else if (selection.length < 3) {
                    const shared = sharedSet();
                    if (shared.has(w) && selection.some((x) => shared.has(x))) {
                        toast("Just one shared word per group.");

                    }

            /* Shuffle: re-randomize only the still-in-play tiles among the slots they occupy.

            function shuffleBoard() {
                if (over || animating || shuffling) return;
                const hubPlaced = solvedIdx.length >= 2 || over;
                const idxs = [],
                    words = [];
                slots.forEach((w, i) => {
                    if (!w) return;
                    if (colorCat[w] !== undefined)
                        return; /* part of a solved group — leave it */
                    if (w === special && hubPlaced)
                        return; /* hub sits in the centre */
                    idxs.push(i);
                    words.push(w);
                });
                if (words.length < 2) return;
                const orig = words.slice();
                let tries = 0;
                do {
                    for (let k = words.length - 1; k > 0; k--) {
                        const j = Math.floor(Math.random() * (k + 1));
                        [words[k], words[j]] = [words[j], words[k]];
                    }
                } while (
                    ++tries < 6 &&
                    words.every((w, k) => w === orig[k])
                ); /* avoid a no-op shuffle */
                idxs.forEach((i, k) => {
                    slots[i] = words[k];
                });
                suppressFlip = true; /* a shuffle shouldn't trigger a card flip */
                layout(false);
                suppressFlip = false;
                /* don't accept another shuffle until this glide is done */
                if (G) {

                    if (btn) btn.disabled = true;
                    G.delayedCall(0.5 * (0.85 + idxs.length * 0.055), () => {

            function submitGuess() {

                const sel = [...selection];
                guesses.push(sel);

                    if (solvedIdx.includes(i)) return;
                    const full = [special, ...c.words];
                    const m = sel.filter((w) => full.includes(w)).length;
                    if (m === 3 && sel.includes(special)) hit = i;
                    else if (m === 2) oneAway = true;

            function solveAnim(ci, sel) {

            function renderSolvedList() {

            /* ---------- scoring ---------- */

                const dayBefore =

                const past = dailyKey ? otherDailyScores(dailyKey) : [];

                    won &&
                    prevAvg !== null &&

                return {
                    won,
                    perfect,
                    hubFirst,
                    hubMiddle,
                    ruleBreaker,
                    purpleFirst,
                    blueFirst,
                    revRainbow,
                    rainbow,
                    grellow,
                    grue,
                    godDamnit,

            /* the slow, beautiful bit: hub zooms out, explodes, share screen appears */
            function winSequence(won, score) {

            /* count-up score tally — the total starts at 0; "Completed!" supplies the base 100,

            function tallyItems(cs) {

            }
            /* build one readable award row from [emoji, label, point delta]. The delta shows
                 as a coloured +N / −N; achievements (delta 0) show just icon + label on a gold row. */
            function tallyRow(item) {
                const emoji = item[0],
                    label = item[1],
                    delta = item[2];
                const row = document.createElement("div");
                row.className =
                    "tally-row" +
                    (delta > 0 ? " pos" : delta < 0 ? " neg" : " ach");
                row.setAttribute(
                    "data-def",
                    label + (delta ? " " + (delta > 0 ? "+" : "") + delta : ""),
                );

            function shareImage(btn) {
                try {
                    if (window.x43share && dailyKey) x43share(dailyKey);
                } catch (e) {}
                drawShareCard().toBlob(async (blob) => {
                    if (!blob) {
                        flashBtn(btn, "Couldn't render");
                        return;
                    }
                    const file = new File([blob], "4x3-result.png", {
                        type: "image/png",
                    });
                    if (
                        navigator.share &&
                        navigator.canShare &&
                        navigator.canShare({ files: [file] })
                    ) {
                        try {
                            await navigator.share({

                                text: resultDescription(true),
                                url: shareUrl(),
                                title: "4 × 3",
                            });

                        } catch (e) {
                            if (e && e.name === "AbortError") return;
                        } /* user dismissed the sheet: stop, don't fall through */

                        await navigator.clipboard.write([

                const { won, score, ruleBreaker } = calcScore();
                const head =
                    "4 × 3" + (dailyKey ? "\n" + fmtDate(dailyKey) : "");
                const link = noLink ? "" : "\nhankgreen.com/fourbythree";
                if (ruleBreaker)
                    return (
                        head +
                        "\n" +
                        score +
                        " points • RULE BREAKER 💀\n" +
                        resultEmojiRows() +
                        link
                    );
                return (
                    head +
                    "\n" +
                    (won ? score + " points" : "Out of guesses") +
                    " • " +
                    (mistakes
                        ? mistakes + " mistake" + (mistakes === 1 ? "" : "s")
                        : "No mistakes") +
                    "\n" +
                    resultEmojiRows() +
                    link
                );
            }
            function feedbackText() {
                const won = mistakes < MAXM;
                return (
                    "4×3 BETA FEEDBACK\n" +
                    "Result: " +
                    (won ? "solved" : "failed") +
                    " · " +
                    (mistakes
                        ? mistakes + " mistake" + (mistakes === 1 ? "" : "s")
                        : "No mistakes") +
                    "\n" +
                    "Difficulty: " +
                    (fb.diff || "–") +
                    "/5 · Fun: " +
                    (fb.fun || "–") +
                    "/5\n" +
                    "Spotted the special word early: " +
                    (fb.special || "–") +
                    "\n" +
                    "Notes: " +
                    (document.getElementById("fbNotes").value.trim() ||
                        "(none)") +
                    "\n" +
                    guesses
                        .map((g) =>
                            g
                                .map((w) =>
                                    w === special
                                        ? "⭐"
                                        : EMOJI[
                                              cats.findIndex((c) =>
                                                  c.words.includes(w),
                                              )
                                          ] || "⬜",
                                )
                                .join(""),
                        )
                        .join("\n")
                );
            }
            function copyFeedback() {
                copyText(feedbackText(), document.getElementById("fbCopy"));
                if (puzzle.e) {
                    document.getElementById("fbMail").href =
                        "mailto:" +
                        puzzle.e +
                        "?subject=" +
                        encodeURIComponent("4×3 beta feedback") +
                        "&body=" +
                        encodeURIComponent(feedbackText());
                }
            }

            /* ---------- stats ---------- */
            /* per-puzzle history for this browser, keyed by the puzzle's date (daily or archive
               replay). Beta/preview runs have no date and aren't recorded. Read by history.html. */
            function recordHistory() {
                if (!dailyKey) return;
                try {
                    const cs = calcScore();
                    const h = JSON.parse(
                        localStorage.getItem("x43_history") || "{}",
                    );
                    const prev = h[dailyKey];
                    /* rel = "ever played this date on its release day." An archive replay must NOT
                   downgrade a prior release-day play (that would silently break the streak). */
                    const rel =
                        dailyKey === todayStr() || (prev && prev.rel !== 0)
                            ? 1
                            : 0;
                    h[dailyKey] = {
                        s: cs.score,
                        m: mistakes,
                        w: cs.won ? 1 : 0,
                        ms: solveMs,
                        hf: cs.hubFirst ? 1 : 0,
                        hm: cs.hubMiddle ? 1 : 0,
                        pf: cs.purpleFirst ? 1 : 0,
                        bf: cs.blueFirst ? 1 : 0,
                        rr: cs.revRainbow ? 1 : 0,
                        rw: cs.rainbow ? 1 : 0,
                        gr: cs.grellow ? 1 : 0,
                        gu: cs.grue ? 1 : 0,
                        gd: cs.godDamnit ? 1 : 0,
                        db: cs.dayBefore ? 1 : 0,
                        fast: cs.fast ? 1 : 0,
                        rb: cs.ruleBreaker ? 1 : 0,
                        p: cs.perfect ? 1 : 0,
                        ad: adClicked ? 1 : 0,
                        gold: cs.goldPlaque ? 1 : 0,
                        silver: cs.silverPlaque ? 1 : 0,
                        rel: rel /* counts toward the streak; preserved across archive replays */,
                        ts: Date.now(),
                    };
                    localStorage.setItem("x43_history", JSON.stringify(h));
                } catch (e) {}
                /* anonymous, fire-and-forget telemetry to the stats Worker (no PII) */
                try {
                    if (window.x43beacon) {
                        const cs2 = calcScore();
                        x43beacon({
                            p: dailyKey,
                            rel: dailyKey === todayStr() ? 1 : 0,
                            w: cs2.won ? 1 : 0,
                            m: mistakes,
                            s: cs2.score,
                            ms: solveMs,
                            mt: streakWithToday(),
                            ad: adClicked ? 1 : 0,
                        });
                    }
                } catch (e) {}
                /* also stash the rendered share card PNG (separate, capped key so images can't
                 bloat the stats; trims the oldest if we ever hit the storage quota) */
                try {
                    const url = drawShareCard().toDataURL("image/png");
                    const cards = JSON.parse(
                        localStorage.getItem("x43_cards") || "{}",
                    );
                    cards[dailyKey] = url;
                    let ks = Object.keys(cards).sort();
                    while (ks.length > 60)
                        delete cards[ks.shift()]; /* keep the 60 most recent */
                    for (let t = 0; t < 10; t++) {
                        try {
                            localStorage.setItem(
                                "x43_cards",
                                JSON.stringify(cards),
                            );
                            break;
                        } catch (err) {
                            const o = Object.keys(cards).sort();
                            if (o.length <= 1) break;
                            delete cards[o[0]];
                        }
                    }
                } catch (e) {}
            }
            /* tapping the ad grants +AD_BONUS for this game. If the game's already finished,
               re-tally the result quietly so the bonus shows without re-popping the modal. */
            function onAdClick() {
                if (adClicked) return;
                adClicked = true;
                saveGame();
                if (over) {
                    recordHistory();
                    const cs = calcScore();
                    showResult(cs.won, cs.score, false, true);
                }
            }
            /* current consecutive-day streak from this browser's history (matches history.html) */
            function currentStreak() {
                let h;
                try {
                    h = JSON.parse(localStorage.getItem("x43_history") || "{}");
                } catch (e) {
                    return 0;
                }
                const dn = (k) =>
                    Math.round(new Date(k + "T12:00:00").getTime() / 86400000);
                const nums = Object.keys(h)
                    .filter((k) => h[k] && h[k].rel !== 0)
                    .map(dn)
                    .sort(
                        (a, b) => a - b,
                    ); /* exclude only known archive replays (pre-flag entries count) */
                if (!nums.length) return 0;
                const today = dn(todayStr()),
                    last = nums[nums.length - 1];
                if (last !== today && last !== today - 1)
                    return 0; /* streak has lapsed */
                let cur = 1;
                for (let i = nums.length - 1; i > 0; i--) {
                    if (nums[i] === nums[i - 1] + 1) cur++;
                    else break;
                }
                return cur;
            }
            function showStreakTag() {
                const el = document.getElementById("streakTag");
                if (!el) return;
                const s = currentStreak();
                if (s >= 1) {
                    el.textContent = s + "-day streak";
                    el.style.display = "";
                } else el.style.display = "none";
            }
            /* streak the player lands on by finishing today's daily (today counted) — used for the
               score bonus. Only release-day plays count, so archive replays never inflate it. */
            function streakWithToday() {
                let h;
                try {
                    h = JSON.parse(localStorage.getItem("x43_history") || "{}");
                } catch (e) {
                    h = {};
                }
                const dn = (k) =>
                    Math.round(new Date(k + "T12:00:00").getTime() / 86400000);
                const set = new Set(
                    Object.keys(h)
                        .filter((k) => h[k] && h[k].rel !== 0)
                        .map(dn),
                ); /* exclude only known archive replays */
                let d = dn(todayStr());
                set.add(d); /* finishing today's daily counts today */
                let c = 0;
                while (set.has(d)) {
                    c++;
                    d--;
                } /* consecutive release-days ending today */
                return c;
            }
            /* every other daily's final score from this browser's history (excluding one date) —
               powers the Top Score and Above Average badges */
            function otherDailyScores(excl) {
                let h;
                try {
                    h = JSON.parse(localStorage.getItem("x43_history") || "{}");
                } catch (e) {
                    return [];
                }
                const out = [];
                for (const k in h) {
                    if (k !== excl && h[k] && typeof h[k].s === "number")
                        out.push(h[k].s);
                }
                return out;
            }
            function loadStats() {
                try {
                    return JSON.parse(localStorage.getItem("x43_stats")) || {};
                } catch (e) {
                    return {};
                }
            }
            function saveStats(won, score, m) {
                try {
                    const s = loadStats();
                    s.played = (s.played || 0) + 1;
                    if (won) s.won = (s.won || 0) + 1;
                    if (won && m === 0) s.perfect = (s.perfect || 0) + 1;
                    s.best = Math.max(s.best || 0, score);
                    s.points = (s.points || 0) + score;
                    localStorage.setItem("x43_stats", JSON.stringify(s));
                } catch (e) {}
            }

            /* ---------- utils ---------- */
            function toast(msg, ms) {
                const t = document.getElementById("toast");
                clearTimeout(t._x);
                clearTimeout(t._y);
                if (t.classList.contains("fly")) {
                    /* re-fired mid-flight: snap back without animating */
                    t.style.transition = "none";
                    t.classList.remove("fly", "show");
                    void t.offsetWidth;
                    t.style.transition = "";
                }
                /* land on the centre of the 4×3 logo (falls back to the header if missing) */
                const aim = document.querySelector(
                    "header .logo, header h1, header",
                );
                if (aim) {
                    const r = aim.getBoundingClientRect();
                    if (r.height)
                        t.style.top = Math.round(r.top + r.height / 2) + "px";
                }
                t.textContent = msg;
                t.classList.add("show");
                t._x = setTimeout(() => {
                    t.classList.add(
                        "fly",
                    ); /* settle, then shoot up-and-off right */
                    t._y = setTimeout(
                        () => t.classList.remove("show", "fly"),
                        750,
                    );
                }, ms || 1800);
            }

            /* hover (or tap) a defined word in the finished answer list to see its explanation — BETA */
            (function () {
                const sl = document.getElementById("solvedList"),
                    tip = document.getElementById("deftip");
                if (!sl || !tip) return;
                function show(el) {
                    tip.textContent = el.dataset.def || "";
                    tip.classList.add("show");
                    const r = el.getBoundingClientRect(),
                        tw = tip.offsetWidth,
                        th = tip.offsetHeight;
                    const left = Math.max(
                        8,
                        Math.min(
                            r.left + r.width / 2 - tw / 2,
                            innerWidth - tw - 8,
                        ),
                    );
                    let top = r.top - th - 8;
                    if (top < 6) top = r.bottom + 8;
                    tip.style.left = left + "px";
                    tip.style.top = top + "px";
                }
                function hide() {
                    tip.classList.remove("show");
                }
                sl.addEventListener("mouseover", (e) => {
                    const t = e.target.closest(".def");
                    if (t) show(t);
                });
                sl.addEventListener("mouseout", (e) => {
                    const t = e.target.closest(".def");
                    if (t) hide();
                });
                sl.addEventListener("click", (e) => {
                    const t = e.target.closest(".def");
                    if (t) {
                        show(t);
                        e.stopPropagation();
                    }
                });
                document.addEventListener("click", (e) => {
                    if (!e.target.closest(".def")) hide();
                });
                window.addEventListener("scroll", hide, true);
            })();

            /* hover/tap the result-modal score icons for their tooltips (reuse #deftip) */
            (function () {
                const mb = document.getElementById("mbody"),
                    tip = document.getElementById("deftip");
                if (!mb || !tip) return;
                function show(el) {
                    tip.textContent = el.dataset.def || "";
                    tip.classList.add("show");
                    const r = el.getBoundingClientRect(),
                        tw = tip.offsetWidth,
                        th = tip.offsetHeight;
                    const left = Math.max(
                        8,
                        Math.min(
                            r.left + r.width / 2 - tw / 2,
                            innerWidth - tw - 8,
                        ),
                    );
                    let top = r.top - th - 8;
                    if (top < 6) top = r.bottom + 8;
                    tip.style.left = left + "px";
                    tip.style.top = top + "px";
                }
                function hide() {
                    tip.classList.remove("show");
                }
                mb.addEventListener("mouseover", (e) => {
                    const t = e.target.closest(".tally-ico");
                    if (t) show(t);
                });
                mb.addEventListener("mouseout", (e) => {
                    const t = e.target.closest(".tally-ico");
                    if (t) hide();
                });
                mb.addEventListener("click", (e) => {
                    const t = e.target.closest(".tally-ico");
                    if (t) {
                        show(t);
                        e.stopPropagation();
                    } else hide();
                });
            })();

            /* +5 for tapping the ad (banner or sidebar) */
            document.addEventListener("click", (e) => {
                if (
                    e.target.closest &&
                    e.target.closest(".promo-banner a, .promo-side a")
                )
                    onAdClick();
            });
            window.addEventListener("hashchange", init);
            init();
            showStreakTag();
            loadPoll();
        </script>
    </body>
</html>
